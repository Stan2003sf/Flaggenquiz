<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Himmel: greift die Seitenfarben der Variable bg-page auf (#EAF6FB / #F1FBF4 / #EEF7F1) -->
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#E3F3FB"/>
      <stop offset="45%" stop-color="#ECF8F6"/>
      <stop offset="100%" stop-color="#E6F4EE"/>
    </linearGradient>

    <!-- Erdkugel: Ozeanblau der Variable color-primary, unten abgedunkelt für Rundung -->
    <radialGradient id="ocean" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#5FB6E8"/>
      <stop offset="55%" stop-color="#2C8FD4"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#4CC47E"/>
      <stop offset="100%" stop-color="#1B7A43"/>
    </linearGradient>
    <!-- Lichtschein oben links auf der Kugel -->
    <radialGradient id="shine" cx="0.3" cy="0.24" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Weicher Schein um die Kugel -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="60%" stop-color="#2C8FD4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2C8FD4" stop-opacity="0"/>
    </radialGradient>
    <!-- Ruhezone: hält die Bildmitte hell, damit die weißen Kacheln darauf klar stehen -->
    <radialGradient id="veil" cx="0.5" cy="0.46" r="0.52">
      <stop offset="0%" stop-color="#F7FBFC" stop-opacity="0.94"/>
      <stop offset="55%" stop-color="#F4FAFB" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#F2F9FA" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="globeClip"><circle cx="0" cy="0" r="420"/></clipPath>

    <!-- Simple Wimpel-Formen für die Girlande -->
    <g id="pennant"><path d="M -30 0 L 30 0 L 0 62 Z"/></g>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- ============ Erdkugel, rechts unten angeschnitten ============ -->
  <g transform="translate(1520 760)">
    <circle cx="0" cy="0" r="620" fill="url(#halo)"/>
    <circle cx="0" cy="0" r="420" fill="url(#ocean)"/>

    <g clip-path="url(#globeClip)">
      <!-- Kontinente, stilisiert (Atlantik-Ansicht) -->
      <g fill="url(#land)" opacity="0.95">
        <!-- Nordamerika -->
        <path d="M -320 -250 C -260 -300 -160 -300 -120 -250 C -100 -210 -140 -180 -150 -140
                 C -160 -100 -190 -70 -215 -90 C -240 -110 -250 -150 -280 -165
                 C -310 -180 -340 -210 -320 -250 Z"/>
        <!-- Südamerika -->
        <path d="M -200 -30 C -160 -45 -130 -15 -140 30 C -148 75 -170 120 -180 175
                 C -188 220 -205 245 -220 225 C -232 205 -222 165 -228 120
                 C -235 70 -240 10 -200 -30 Z"/>
        <!-- Afrika -->
        <path d="M -10 -60 C 60 -85 140 -70 165 -20 C 185 25 150 70 130 110
                 C 110 150 95 200 70 225 C 45 248 20 225 15 190
                 C 8 140 -15 100 -30 55 C -45 10 -50 -40 -10 -60 Z"/>
        <!-- Europa -->
        <path d="M -25 -200 C 30 -225 100 -220 120 -185 C 135 -155 105 -135 80 -120
                 C 50 -100 10 -95 -15 -110 C -40 -125 -50 -175 -25 -200 Z"/>
        <!-- Asien -->
        <path d="M 130 -230 C 200 -270 300 -255 335 -200 C 360 -160 330 -120 290 -100
                 C 245 -78 195 -95 165 -125 C 140 -150 110 -195 130 -230 Z"/>
        <!-- Ozeanien -->
        <path d="M 250 100 C 300 80 340 105 335 145 C 330 180 290 195 260 180
                 C 232 166 225 120 250 100 Z"/>
      </g>

      <!-- Längen- und Breitengrade -->
      <g fill="none" stroke="#EAF6FB" stroke-opacity="0.32" stroke-width="2.5">
        <ellipse cx="0" cy="0" rx="420" ry="420"/>
        <ellipse cx="0" cy="0" rx="300" ry="420"/>
        <ellipse cx="0" cy="0" rx="160" ry="420"/>
        <line x1="0" y1="-420" x2="0" y2="420"/>
        <ellipse cx="0" cy="-280" rx="313" ry="34"/>
        <ellipse cx="0" cy="-150" rx="392" ry="44"/>
        <ellipse cx="0" cy="0" rx="420" ry="50"/>
        <ellipse cx="0" cy="150" rx="392" ry="44"/>
        <ellipse cx="0" cy="280" rx="313" ry="34"/>
      </g>

      <circle cx="0" cy="0" r="420" fill="url(#shine)"/>
    </g>
    <circle cx="0" cy="0" r="420" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4"/>
  </g>

  <!-- ============ Wimpelgirlande oben ============ -->
  <g opacity="0.9">
    <path d="M -40 96 Q 480 250 980 150 T 1960 118" fill="none" stroke="#0D47A1" stroke-opacity="0.35" stroke-width="4"/>
    <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2">
      <g transform="translate(90 122) rotate(10)"  fill="#E5453C"><use href="#pennant"/></g>
      <g transform="translate(230 158) rotate(7)"  fill="#F5C542"><use href="#pennant"/></g>
      <g transform="translate(370 186) rotate(4)"  fill="#2C8FD4"><use href="#pennant"/></g>
      <g transform="translate(510 208) rotate(2)"  fill="#26A65B"><use href="#pennant"/></g>
      <g transform="translate(650 222) rotate(0)"  fill="#FF9800"><use href="#pennant"/></g>
      <g transform="translate(790 224) rotate(-2)" fill="#8E5AC8"><use href="#pennant"/></g>
      <g transform="translate(930 214) rotate(-4)" fill="#E5453C"><use href="#pennant"/></g>
      <g transform="translate(1070 196) rotate(-5)" fill="#2C8FD4"><use href="#pennant"/></g>
      <g transform="translate(1210 176) rotate(-5)" fill="#F5C542"><use href="#pennant"/></g>
      <g transform="translate(1350 158) rotate(-5)" fill="#26A65B"><use href="#pennant"/></g>
      <g transform="translate(1490 142) rotate(-4)" fill="#FF9800"><use href="#pennant"/></g>
      <g transform="translate(1630 130) rotate(-3)" fill="#8E5AC8"><use href="#pennant"/></g>
      <g transform="translate(1770 122) rotate(-2)" fill="#E5453C"><use href="#pennant"/></g>
    </g>
  </g>

  <!-- ============ Schwebende Flaggen (stilisiert, kein echtes Land) ============ -->
  <g stroke="#0D47A1" stroke-opacity="0.14" stroke-width="2">
    <!-- Trikolore senkrecht, links oben -->
    <g transform="translate(150 470) rotate(-8)">
      <rect x="0" y="0" width="132" height="88" rx="7" fill="#FFFFFF"/>
      <rect x="0" y="0" width="44" height="88" fill="#2C8FD4"/>
      <rect x="88" y="0" width="44" height="88" fill="#E5453C"/>
    </g>
    <!-- Nordisches Kreuz, links unten -->
    <g transform="translate(268 812) rotate(6)">
      <rect x="0" y="0" width="132" height="88" rx="7" fill="#2C8FD4"/>
      <rect x="0" y="36" width="132" height="18" fill="#FFFFFF"/>
      <rect x="40" y="0" width="18" height="88" fill="#FFFFFF"/>
    </g>
    <!-- Waagerechte Trikolore, oben rechts der Mitte -->
    <g transform="translate(1010 372) rotate(5)">
      <rect x="0" y="0" width="132" height="88" rx="7" fill="#FFFFFF"/>
      <rect x="0" y="0" width="132" height="29" fill="#26A65B"/>
      <rect x="0" y="59" width="132" height="29" fill="#FF9800"/>
    </g>
    <!-- Sonnenscheibe, unten mittig -->
    <g transform="translate(690 906) rotate(-5)">
      <rect x="0" y="0" width="132" height="88" rx="7" fill="#FFFFFF"/>
      <circle cx="66" cy="44" r="26" fill="#E5453C"/>
    </g>
    <!-- Stern auf Blau, ganz rechts oben -->
    <g transform="translate(1748 452) rotate(9)">
      <rect x="0" y="0" width="132" height="88" rx="7" fill="#0D47A1"/>
      <path d="M 66 20 L 74 40 L 96 40 L 78 53 L 85 74 L 66 61 L 47 74 L 54 53 L 36 40 L 58 40 Z" fill="#F5C542"/>
    </g>
  </g>

  <!-- ============ Leichte Funken ============ -->
  <g fill="#FFFFFF" opacity="0.75">
    <circle cx="430" cy="240" r="4"/><circle cx="640" cy="640" r="3"/>
    <circle cx="1180" cy="700" r="4"/><circle cx="1560" cy="300" r="3"/>
    <circle cx="880" cy="480" r="3"/><circle cx="320" cy="660" r="3"/>
    <circle cx="1400" cy="920" r="4"/><circle cx="120" cy="300" r="3"/>
  </g>

  <!-- Ruhezone zuletzt: legt sich über alles Dahinterliegende -->
  <rect width="1920" height="1080" fill="url(#veil)"/>
</svg>
